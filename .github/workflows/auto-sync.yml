name: Auto Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *' # Automatically runs every day at 00:00 UTC
  workflow_dispatch: # Allows manual one-click sync anytime from Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync ${{ github.repository }} -b main
